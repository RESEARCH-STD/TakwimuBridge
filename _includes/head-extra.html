<!-- Google Fonts: Inter (body) + Space Grotesk (headings), adopted from
     geoai-africa.com's type system -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

<!--
  Third-party libraries loaded only because they provide capability Quarto's
  bundled Bootstrap does not (charts, word clouds, spreadsheet export, DOCX
  parsing) — kept to the minimum needed for the coding/analysis workflow.
  All loaded with `defer` so they execute, in this order, before
  DOMContentLoaded — every page script below waits for DOMContentLoaded
  before touching `TB`, so load order here is all that matters.
-->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/wordcloud@1.2.2/src/wordcloud2.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js" defer></script>

<!-- TakwimuBridge app scripts (shared across every page) -->
<script src="assets/app.js" defer></script>
<script src="assets/demo-data.js" defer></script>
<script src="assets/coding-ui.js" defer></script>
<script src="assets/charts.js" defer></script>
<script src="assets/export.js" defer></script>

<!--
  Navbar: transparent over the hero, frosted/blurred once scrolled past
  50px — adopted from geoai-africa.com. Only takes effect on the page that
  actually has a .hero-section (index.qmd); the corresponding CSS in
  custom.scss is scoped with :has() the same way, so this is a no-op
  elsewhere.
-->
<script>
document.addEventListener("DOMContentLoaded", function () {
  var header = document.getElementById("quarto-header");
  var navEl = header && header.querySelector(".navbar");
  if (!header || !navEl || !document.querySelector(".hero-section")) return;
  function onScroll() {
    var scrolled = window.pageYOffset > 50;
    header.classList.toggle("navbar-scrolled", scrolled);
    navEl.setAttribute("data-bs-theme", scrolled ? "light" : "dark");
  }
  window.addEventListener("scroll", onScroll, { passive: true });
  onScroll();
});
</script>
