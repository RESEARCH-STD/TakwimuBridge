project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"

# ---------------------------------------------------------------------------
# NOTE ON NAMING: "TakwimuBridge" is the product name given in SST's own
# functional description document for this qualitative data analysis tool.
# The sibling project ../SITE-1 separately uses "Takwimu Bridge" (with a
# space) as an explicitly-labeled PLACEHOLDER name for an unrelated data
# CATALOG site. That is a naming collision the user should resolve (rename
# one of the two, or confirm both are intentionally part of one product
# family) — see README.md.
# ---------------------------------------------------------------------------

# Navigation lives in the dashboard sidebar (_includes/app-shell.html), not
# a Quarto navbar, so the tool reads as an application rather than a
# marketing site like ../SITE-1.
website:
  title: "TakwimuBridge"
  description: "A qualitative data analysis tool for researchers, students, consultants and institutions — code, weigh, compare and visualize KIIs, FGDs, interviews and open-ended responses, entirely in your browser."
  site-url: "https://sustainable-solutions-tz.github.io/takwimubridge-qda/"
  favicon: images/logo.svg
  page-navigation: false
  bread-crumbs: false
  search: false
  open-graph: true
  twitter-card: true

  page-footer:
    left: "© 2026 Sustainable Solutions Tanzania (SST) · TakwimuBridge"
    right: "Client-side proof of concept — your data stays in this browser."

format:
  html:
    theme:
      light: [flatly, custom.scss]
    include-in-header: _includes/head-extra.html
    include-before-body: _includes/app-shell.html
    page-layout: custom
    # Tables here are empty shells filled by JavaScript. Left on, Quarto
    # tries to convert them and, on failure, silently drops the raw HTML
    # that precedes them in the same block.
    html-table-processing: none
    toc: false
    link-external-icon: false
    link-external-newwindow: true
    highlight-style: github
